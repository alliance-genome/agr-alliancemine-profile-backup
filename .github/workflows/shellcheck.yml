name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint scripts
        run: shellcheck scripts/*.sh

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup and restore against a throwaway cluster
        run: |
          PATH="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1):$PATH"
          export PATH
          bash tests/local_backup_test.sh
